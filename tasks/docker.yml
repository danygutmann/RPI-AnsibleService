- name: Basis-Pakete installieren
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: Keyring-Verzeichnis anlegen
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Docker GPG-Key herunterladen
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Docker Repo eintragen
  apt_repository:
    repo: >-
      deb [arch={{ docker_arch_map[ansible_architecture] | default('arm64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Docker Engine installieren
  apt:
    update_cache: yes
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Docker starten und aktivieren
  service:
    name: docker
    state: started
    enabled: true

- name: User pi zur docker-Gruppe hinzufügen
  user:
    name: pi
    groups: docker
    append: true

- name: Docker Version prüfen
  command: docker --version
  register: docker_version
  changed_when: false

- name: Docker Version ausgeben
  debug:
    var: docker_version.stdout
  
- name: Docker-Container als pi anzeigen
  become: true
  become_user: pi
  command: docker ps
  register: docker_ps
  changed_when: false

- name: Docker-Container ausgeben
  debug:
    var: docker_ps.stdout_lines