- name: VLANs auf eth0 konfigurieren
  become: true
  vars:
    rpi_vlans:
      - { id: 50,  address: "192.168.150.13/24", gateway: "192.168.150.1" }
     # - { id: 2,   address: "192.168.102.1/24" }
      - { id: 110, address: "192.168.210.1/24" }
      - { id: 101, address: "192.168.201.1/24" }
      - { id: 32,  address: "192.168.132.1/24" }
      - { id: 35,  address: "192.168.135.13/24" }
      - { id: 31,  address: "192.168.131.1/24" }
      - { id: 36,  address: "192.168.136.13/24" }
      - { id: 90,  address: "192.168.190.2/24" }
      - { id: 71,  address: "192.168.171.2/24" }


  block:
    - name: Prüfen, ob NetworkManager läuft
      ansible.builtin.command: systemctl is-active NetworkManager
      changed_when: false

    - name: VLAN-Profile anlegen oder aktualisieren
      community.general.nmcli:
        conn_name: "vlan{{ item.id }}"
        type: vlan
        ifname: "eth0.{{ item.id }}"
        vlandev: eth0
        vlanid: "{{ item.id }}"
        ip4: "{{ item.address }}"
        method4: manual
        gw4: "{{ item.gateway | default(omit) }}"
        autoconnect: true
        conn_reload: true
        state: present
      loop: "{{ rpi_vlans }}"
      loop_control:
        label: "vlan{{ item.id }} ({{ item.address }})"

    - name: VLAN-Verbindungen aktivieren
      community.general.nmcli:
        conn_name: "vlan{{ item.id }}"
        state: up
      loop: "{{ rpi_vlans }}"
      loop_control:
        label: "vlan{{ item.id }}"

    - name: Aktive Verbindungen anzeigen
      ansible.builtin.command: nmcli -t -f NAME,DEVICE connection show --active
      register: vlan_connections
      changed_when: false

    - name: Aktive Verbindungen ausgeben
      ansible.builtin.debug:
        var: vlan_connections.stdout_lines

    - name: IPv4-Routen anzeigen
      ansible.builtin.command: ip -4 route
      register: vlan_routes
      changed_when: false

    - name: IPv4-Routen ausgeben
      ansible.builtin.debug:
        var: vlan_routes.stdout_lines